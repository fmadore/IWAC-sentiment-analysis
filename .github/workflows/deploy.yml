name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend / data contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./ma-visualisation-sentiments
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ma-visualisation-sentiments/package-lock.json

      - name: Cache SvelteKit artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ma-visualisation-sentiments/.svelte-kit
            ma-visualisation-sentiments/node_modules/.cache
          key: ${{ runner.os }}-sveltekit-${{ hashFiles('ma-visualisation-sentiments/package-lock.json') }}
          restore-keys: ${{ runner.os }}-sveltekit-

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm run test:run

      - name: Build and verify artifact budgets
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility smoke tests
        run: npm run test:e2e

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./ma-visualisation-sentiments/build

  python:
    name: Python / generated data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            data-preprocess/requirements.txt
            data-preprocess/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r data-preprocess/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q data-preprocess

      - name: Lint and format check
        run: |
          ruff check data-preprocess
          ruff format --check data-preprocess

      - name: Run all preprocessing and checked-in data tests
        run: python -m pytest data-preprocess -q

      - name: Audit Python runtime dependencies
        run: pip-audit -r data-preprocess/requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  deploy:
    if: github.event_name != 'pull_request'
    needs: [frontend, python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
