name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ma-visualisation-sentiments
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ma-visualisation-sentiments/package-lock.json

      - name: Cache SvelteKit artifacts
        uses: actions/cache@v6
        with:
          path: |
            ma-visualisation-sentiments/.svelte-kit
            ma-visualisation-sentiments/node_modules/.cache
          key: ${{ runner.os }}-sveltekit-${{ hashFiles('ma-visualisation-sentiments/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sveltekit-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      # The preprocessing helpers produce the dataset the dashboard cites, so
      # their tests gate the deploy alongside the frontend's. Only the pure
      # helpers are exercised — no network, no API keys.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run preprocessing tests
        working-directory: .
        run: |
          pip install pandas huggingface_hub pytest
          python -m pytest data-preprocess/test_shared.py -q

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./ma-visualisation-sentiments/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
