name: Cross-browser smoke tests

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./ma-visualisation-sentiments
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ma-visualisation-sentiments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the production artifact
        run: npm run build

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Check navigation, downloads and worker recovery
        env:
          PLAYWRIGHT_CROSS_BROWSER: "1"
        run: npm run test:e2e -- e2e/browser-smoke.spec.ts

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-results
          path: |
            ma-visualisation-sentiments/test-results/
            ma-visualisation-sentiments/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
