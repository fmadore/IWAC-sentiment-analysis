name: Cross-browser smoke tests

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./ma-visualisation-sentiments
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ma-visualisation-sentiments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the production artifact
        timeout-minutes: 6
        run: npm run build

      # Keyed on the lockfile, which pins Playwright, as in deploy.yml. The OS
      # packages are installed either way. Step timeouts keep a hung download
      # or test (the 2026-10-26 run sat until the job limit) from eating the
      # whole budget silently.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-webkit-${{ hashFiles('ma-visualisation-sentiments/package-lock.json') }}

      - name: Install Firefox and WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install --with-deps firefox webkit

      - name: Install Firefox and WebKit system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 4
        run: npx playwright install-deps firefox webkit

      - name: Check navigation, downloads and worker recovery
        timeout-minutes: 7
        env:
          PLAYWRIGHT_CROSS_BROWSER: "1"
        run: npm run test:e2e -- e2e/browser-smoke.spec.ts

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-results
          path: |
            ma-visualisation-sentiments/test-results/
            ma-visualisation-sentiments/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
