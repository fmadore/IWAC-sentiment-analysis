version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm dependencies (SvelteKit frontend)
  #
  # The two groups partition package.json by dependency-type instead of naming
  # themes. Thematic patterns leave silent gaps: anything no pattern names
  # (@lucide/svelte, maplibre-gl, openseadragon, esm-env, globals) opens its own
  # pull request, and a dependency added later just quietly starts arriving
  # alone. production/development is a total partition, so nothing escapes it.
  #
  # `update-types` deliberately holds majors out of both groups so each one
  # arrives on its own, reviewable branch rather than buried in a batch.
  - package-ecosystem: npm
    directory: /ma-visualisation-sentiments
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Avoid major bumps on core framework deps without manual review
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # Map rendering upgrades are reviewed manually against the browser smoke
      # suite rather than merged as unattended major bumps.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte-maplibre-gl"
        update-types: ["version-update:semver-major"]

  # Python dependencies (data preprocessing)
  #
  # Runtime and dev are split because the split is meaningful here: a runtime
  # bump can move the published figures and wants a pipeline re-run (see the
  # header of requirements.txt), a dev-tool bump only touches CI.
  #
  # Neither group carries an `update-types` filter. The previous config did, and
  # every pip update still arrived as its own pull request even though all of
  # them were minor or patch — these are requirements.txt constraint bumps with
  # no lockfile, and the filter did not match them. Majors therefore land inside
  # a group; the requirements.txt header is what flags them for a deliberate
  # re-run.
  - package-ecosystem: pip
    directory: /data-preprocess
    schedule:
      interval: monthly
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest"
          - "ruff"
          - "pip-audit"
      python-dev:
        patterns:
          - "pytest"
          - "ruff"
          - "pip-audit"
