<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192x192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			The document title, description, keywords, author, robots, canonical
			and the whole Open Graph / Twitter block are emitted by
			`SEOHead.svelte`, which knows the active view and the active language.
			They are deliberately absent here: this template's markup lands *before*
			`%sveltekit.head%`, and a crawler reading a duplicated title or og
			property takes the first one it meets — so a static copy here would
			silently outrank every per-view, localised tag SEOHead produces.

			Only tags SEOHead does not own belong below.
		-->

		<!-- PWA Configuration -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="application-name" content="IWAC Sentiment Analysis" />
		<meta name="apple-mobile-web-app-title" content="IWAC Analysis" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- Browser chrome matches --app-bg-elevated (the header surface); the
		     splash/tile use --app-bg. Both are the sRGB renderings of the OKLCH
		     tokens in app.css — keep them in step with `scripts/oklch-to-hex.py`. -->
		<meta name="theme-color" content="#10141a" />
		<meta name="msapplication-TileColor" content="#0a0d12" />
		<meta name="msapplication-config" content="%sveltekit.assets%/browserconfig.xml" />

		<!-- Structured Data for better search results -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "IWAC Sentiment Analysis",
				"description": "Interactive visualization of sentiment analysis results from the Islam West Africa Collection",
				"url": "https://iwac.frederickmadore.com/sentiment-analysis/",
				"applicationCategory": "DataVisualization",
				"operatingSystem": "Web Browser",
				"author": {
					"@type": "Person",
					"name": "Frédérick Madore",
					"url": "https://www.frederickmadore.com/",
					"sameAs": "https://orcid.org/0000-0003-0959-2092",
					"affiliation": {
						"@type": "Organization",
						"name": "University of Bayreuth"
					}
				},
				"license": "https://opensource.org/licenses/MIT",
				"identifier": "https://doi.org/10.5281/zenodo.21806223",
				"isBasedOn": {
					"@type": "Dataset",
					"name": "Islam West Africa Collection",
					"url": "https://islam.zmo.de/s/afrique_ouest/",
					"identifier": "https://doi.org/10.57967/hf/9857"
				},
				"codeRepository": "https://github.com/fmadore/IWAC-sentiment-analysis",
				"inLanguage": ["fr", "en"],
				"keywords": [
					"sentiment analysis",
					"Islam West Africa",
					"data visualization",
					"AI analysis",
					"research tool"
				]
			}
		</script>

		<!--
			Editorial typography pairing for an investigative-data-journalism feel:
			- Source Serif 4: display headings, brand title, view titles
			- Public Sans:    body, UI, labels (wire-service neutral)
			- JetBrains Mono: eyebrows, tabular numbers, methodology metadata

			Loaded as a plain stylesheet on a pre-connected origin. The previous
			`rel=preload as=style` + onload-swap dance was the classic non-blocking
			recipe, but Firefox does not credit the swapped-in stylesheet against the
			preload and logs "preloaded with link preload was not used within a few
			seconds" on every page load. The CSS itself is ~2 kB from an origin the
			preconnect has already warmed, and `display=swap` means text paints in the
			fallback face regardless — so the blocking cost is negligible and the
			inline onload handler (also a CSP liability) buys nothing.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400..800;1,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..800;1,8..60,400..800&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap"
		/>

		<!-- Font display fallbacks to prevent invisible text -->
		<style>
			/* System font fallback to prevent CLS */
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
					sans-serif;
			}

			/* Font loading optimization */
			.font-loading {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
					sans-serif;
			}

			/* Prevent accordion layout shift */
			.accordion-content {
				will-change: height;
				overflow: hidden;
			}

			/* Reserve space for loading states */
			.loading-skeleton {
				background: linear-gradient(
					90deg,
					rgba(255, 255, 255, 0.1) 25%,
					rgba(255, 255, 255, 0.2) 50%,
					rgba(255, 255, 255, 0.1) 75%
				);
				background-size: 200% 100%;
				animation: loading 1.5s infinite;
			}

			@keyframes loading {
				0% {
					background-position: 200% 0;
				}
				100% {
					background-position: -200% 0;
				}
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="cerberus">
		<div class="app-container">%sveltekit.body%</div>
	</body>
</html>
